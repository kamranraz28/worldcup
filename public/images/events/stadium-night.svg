<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Floodlit stadium at night">
  <defs>
    <linearGradient id="snSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06060E"/>
      <stop offset="0.5" stop-color="#150A1C"/>
      <stop offset="1" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="snGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD54F" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#E30613" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#E30613" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snBowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1B2E"/>
      <stop offset="1" stop-color="#08080F"/>
    </linearGradient>
    <linearGradient id="snPitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B7A3C" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0A2416"/>
    </linearGradient>
    <linearGradient id="snBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6D8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFF6D8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="snCrowd" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="8.5" fill="#0B0B14"/>
      <circle cx="0" cy="0" r="8.5" fill="#0B0B14"/>
      <circle cx="26" cy="0" r="8.5" fill="#0B0B14"/>
      <circle cx="0" cy="26" r="8.5" fill="#0B0B14"/>
      <circle cx="26" cy="26" r="8.5" fill="#0B0B14"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#snSky)"/>
  <ellipse cx="600" cy="250" rx="620" ry="330" fill="url(#snGlow)"/>

  <!-- stars -->
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="120" cy="70" r="1.6"/><circle cx="260" cy="130" r="1.1"/><circle cx="420" cy="60" r="1.4"/>
    <circle cx="760" cy="90" r="1.2"/><circle cx="900" cy="150" r="1.6"/><circle cx="1080" cy="80" r="1.1"/>
    <circle cx="640" cy="45" r="1.3"/><circle cx="340" cy="200" r="1"/><circle cx="980" cy="220" r="1"/>
  </g>

  <!-- floodlight towers -->
  <g>
    <path d="M120 0 L120 250" stroke="#1A1A26" stroke-width="7"/>
    <rect x="78" y="228" width="84" height="30" rx="6" fill="#241F35"/>
    <g fill="#FFF3C4" opacity="0.95">
      <circle cx="94" cy="243" r="5"/><circle cx="112" cy="243" r="5"/><circle cx="130" cy="243" r="5"/><circle cx="148" cy="243" r="5"/>
    </g>
    <path d="M120 258 L300 470 L60 470 Z" fill="url(#snBeam)"/>

    <path d="M1080 0 L1080 250" stroke="#1A1A26" stroke-width="7"/>
    <rect x="1038" y="228" width="84" height="30" rx="6" fill="#241F35"/>
    <g fill="#FFF3C4" opacity="0.95">
      <circle cx="1054" cy="243" r="5"/><circle cx="1072" cy="243" r="5"/><circle cx="1090" cy="243" r="5"/><circle cx="1108" cy="243" r="5"/>
    </g>
    <path d="M1080 258 L900 470 L1140 470 Z" fill="url(#snBeam)"/>
  </g>

  <!-- stadium bowl -->
  <path d="M40 470 C40 250 260 170 600 170 C940 170 1160 250 1160 470 Z" fill="url(#snBowl)"/>
  <path d="M70 470 C70 268 280 200 600 200 C920 200 1130 268 1130 470 Z" fill="url(#snCrowd)" opacity="0.85"/>
  <path d="M40 470 C40 250 260 170 600 170 C940 170 1160 250 1160 470" fill="none" stroke="#E30613" stroke-width="3" opacity="0.35"/>

  <!-- ribbon board -->
  <rect x="0" y="452" width="1200" height="20" fill="#0A0A12"/>
  <rect x="0" y="452" width="1200" height="20" fill="#E30613" opacity="0.35"/>
  <g fill="#FFD54F" opacity="0.55">
    <rect x="90" y="458" width="52" height="8" rx="4"/><rect x="300" y="458" width="52" height="8" rx="4"/>
    <rect x="520" y="458" width="52" height="8" rx="4"/><rect x="760" y="458" width="52" height="8" rx="4"/>
    <rect x="1000" y="458" width="52" height="8" rx="4"/>
  </g>

  <!-- pitch -->
  <path d="M60 675 L150 472 L1050 472 L1140 675 Z" fill="url(#snPitch)"/>
  <g opacity="0.10" fill="#FFFFFF">
    <rect x="300" y="472" width="86" height="203"/><rect x="472" y="472" width="86" height="203"/>
    <rect x="644" y="472" width="86" height="203"/><rect x="816" y="472" width="86" height="203"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.35" fill="none" stroke-width="3">
    <path d="M170 675 L240 472"/><path d="M1030 675 L960 472"/>
    <ellipse cx="600" cy="592" rx="170" ry="52"/>
    <path d="M430 675 L470 472"/><path d="M770 675 L730 472"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3">
    <path d="M232 500 L968 500 L1010 620 L190 620 Z"/>
  </g>

  <!-- goals -->
  <g stroke="#F1F1F7" stroke-opacity="0.7" stroke-width="4" fill="none">
    <path d="M232 500 L222 566"/><path d="M232 500 L252 500"/><path d="M232 500 L232 566"/>
    <path d="M968 500 L978 566"/><path d="M968 500 L948 500"/><path d="M968 500 L968 566"/>
  </g>

  <!-- ball -->
  <circle cx="600" cy="592" r="17" fill="#FAFAFA"/>
  <g fill="#171717">
    <path d="M600 583 l6 5 -2.5 7.5 h-7 l-2.5 -7.5 z"/>
    <circle cx="589" cy="596" r="3"/><circle cx="611" cy="596" r="3"/>
    <circle cx="595" cy="607" r="3"/><circle cx="605" cy="607" r="3"/>
  </g>

  <rect width="1200" height="675" fill="#050508" opacity="0.12"/>
</svg>
