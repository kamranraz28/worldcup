<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Giant screen live screening in a packed venue">
  <defs>
    <linearGradient id="bsRoom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0710"/>
      <stop offset="1" stop-color="#04040A"/>
    </linearGradient>
    <radialGradient id="bsGlow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#E30613" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bsScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1B12"/>
      <stop offset="0.55" stop-color="#0A2A17"/>
      <stop offset="1" stop-color="#04150B"/>
    </linearGradient>
    <linearGradient id="bsBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DBEAFE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#DBEAFE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="bsCrowd" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="10" fill="#0A0A12"/>
      <circle cx="0" cy="0" r="10" fill="#0A0A12"/>
      <circle cx="30" cy="0" r="10" fill="#0A0A12"/>
      <circle cx="0" cy="30" r="10" fill="#0A0A12"/>
      <circle cx="30" cy="30" r="10" fill="#0A0A12"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bsRoom)"/>
  <ellipse cx="600" cy="290" rx="560" ry="330" fill="url(#bsGlow)"/>

  <!-- light beams -->
  <path d="M300 0 L470 520 L150 520 Z" fill="url(#bsBeam)"/>
  <path d="M900 0 L730 520 L1050 520 Z" fill="url(#bsBeam)"/>

  <!-- giant screen frame -->
  <rect x="290" y="60" width="620" height="350" rx="18" fill="#16161F"/>
  <rect x="290" y="60" width="620" height="350" rx="18" fill="none" stroke="#2A2A40" stroke-width="3"/>
  <rect x="308" y="78" width="584" height="314" rx="10" fill="url(#bsScreen)"/>

  <!-- screen content: mini pitch -->
  <g opacity="0.9">
    <path d="M330 392 L392 96 L808 96 L870 392 Z" fill="#16A34A" opacity="0.22"/>
    <g stroke="#FAFAFA" stroke-opacity="0.4" fill="none" stroke-width="2.5">
      <ellipse cx="600" cy="300" rx="120" ry="42"/>
      <path d="M600 96 L600 392"/>
      <path d="M430 96 L400 200 L440 200"/>
      <path d="M770 96 L800 200 L760 200"/>
    </g>
    <circle cx="600" cy="300" r="12" fill="#FAFAFA" opacity="0.8"/>
  </g>

  <!-- scoreboard on screen -->
  <g>
    <rect x="490" y="98" width="220" height="46" rx="10" fill="#050508" opacity="0.75"/>
    <rect x="508" y="112" width="52" height="18" rx="6" fill="#E30613" opacity="0.9"/>
    <rect x="640" y="112" width="52" height="18" rx="6" fill="#3B82F6" opacity="0.9"/>
    <rect x="572" y="118" width="56" height="6" rx="3" fill="#FFFFFF" opacity="0.35"/>
  </g>
  <rect x="308" y="78" width="584" height="314" rx="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

  <!-- screen glow spill -->
  <ellipse cx="600" cy="440" rx="420" ry="80" fill="#3B82F6" opacity="0.10"/>

  <!-- stage speakers -->
  <g fill="#0E0E16">
    <rect x="150" y="380" width="80" height="120" rx="8"/>
    <rect x="970" y="380" width="80" height="120" rx="8"/>
  </g>
  <g fill="#E30613" opacity="0.35">
    <circle cx="190" cy="410" r="10"/><circle cx="190" cy="470" r="10"/>
    <circle cx="1010" cy="410" r="10"/><circle cx="1010" cy="470" r="10"/>
  </g>

  <!-- speaker light cones -->
  <path d="M190 400 L110 520 L270 520 Z" fill="url(#bsBeam)" opacity="0.7"/>
  <path d="M1010 400 L930 520 L1090 520 Z" fill="url(#bsBeam)" opacity="0.7"/>

  <!-- crowd -->
  <rect x="0" y="470" width="1200" height="205" fill="url(#bsCrowd)"/>
  <rect x="0" y="470" width="1200" height="10" fill="#E30613" opacity="0.25"/>

  <!-- raised arms silhouette -->
  <g stroke="#0A0A12" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M180 610 L180 500"/><path d="M180 500 L158 466"/><path d="M180 500 L202 466"/>
    <path d="M1020 610 L1020 500"/><path d="M1020 500 L998 466"/><path d="M1020 500 L1042 466"/>
    <path d="M600 580 L600 480"/><path d="M600 480 L576 448"/><path d="M600 480 L624 448"/>
  </g>
  <g fill="#0A0A12">
    <circle cx="180" cy="624" r="16"/><circle cx="1020" cy="624" r="16"/><circle cx="600" cy="592" r="16"/>
  </g>

  <rect width="1200" height="675" fill="#050508" opacity="0.10"/>
</svg>
