<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Conference stage with presenter and screen">
  <defs>
    <linearGradient id="wsBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07130F"/>
      <stop offset="0.5" stop-color="#0B1A18"/>
      <stop offset="1" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="wsGlow" cx="0.5" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#16A34A" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#16A34A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wsScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F2A22"/>
      <stop offset="1" stop-color="#08170F"/>
    </linearGradient>
    <linearGradient id="wsBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCFCE7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#DCFCE7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#wsBg)"/>
  <ellipse cx="600" cy="240" rx="580" ry="320" fill="url(#wsGlow)"/>

  <!-- side beams -->
  <path d="M240 0 L80 470 L400 470 Z" fill="url(#wsBeam)"/>
  <path d="M960 0 L800 470 L1120 470 Z" fill="url(#wsBeam)"/>

  <!-- big screen with analytics -->
  <rect x="290" y="70" width="620" height="330" rx="16" fill="#14141F"/>
  <rect x="290" y="70" width="620" height="330" rx="16" fill="none" stroke="#1E1E2A" stroke-width="3"/>
  <rect x="308" y="88" width="584" height="294" rx="10" fill="url(#wsScreen)"/>

  <g>
    <!-- chart title -->
    <rect x="336" y="112" width="170" height="12" rx="6" fill="#DCFCE7" opacity="0.35"/>
    <rect x="336" y="132" width="100" height="8" rx="4" fill="#DCFCE7" opacity="0.18"/>

    <!-- bar chart -->
    <g opacity="0.9">
      <rect x="346" y="300" width="40" height="66" rx="6" fill="#16A34A" opacity="0.55"/>
      <rect x="400" y="272" width="40" height="94" rx="6" fill="#16A34A" opacity="0.7"/>
      <rect x="454" y="288" width="40" height="78" rx="6" fill="#16A34A" opacity="0.6"/>
      <rect x="508" y="240" width="40" height="126" rx="6" fill="#16A34A" opacity="0.85"/>
      <rect x="562" y="256" width="40" height="110" rx="6" fill="#16A34A" opacity="0.75"/>
    </g>
    <!-- trend line -->
    <path d="M366 288 L420 258 L474 276 L528 224 L582 242 L646 200" fill="none" stroke="#FFD54F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#FFD54F">
      <circle cx="366" cy="288" r="6"/><circle cx="420" cy="258" r="6"/><circle cx="474" cy="276" r="6"/>
      <circle cx="528" cy="224" r="6"/><circle cx="582" cy="242" r="6"/><circle cx="646" cy="200" r="6"/>
    </g>

    <!-- pitch heatmap -->
    <g transform="translate(700 180)">
      <rect x="0" y="0" width="160" height="176" rx="10" fill="#16A34A" opacity="0.12"/>
      <rect x="0" y="0" width="160" height="176" rx="10" fill="none" stroke="#16A34A" stroke-opacity="0.35" stroke-width="2"/>
      <rect x="0" y="0" width="160" height="88" fill="#16A34A" opacity="0.10"/>
      <path d="M0 88 L160 88" stroke="#16A34A" stroke-opacity="0.35" stroke-width="2"/>
      <circle cx="0" cy="88" r="30" fill="none" stroke="#16A34A" stroke-opacity="0.35" stroke-width="2"/>
      <path d="M160 0 L160 176" stroke="#16A34A" stroke-opacity="0.35" stroke-width="2"/>
      <path d="M160 44 L124 44 L124 132 L160 132" fill="none" stroke="#16A34A" stroke-opacity="0.35" stroke-width="2"/>
      <g>
        <circle cx="42" cy="60" r="11" fill="#E30613" opacity="0.8"/>
        <circle cx="96" cy="104" r="14" fill="#FFD54F" opacity="0.75"/>
        <circle cx="52" cy="140" r="9" fill="#3B82F6" opacity="0.8"/>
        <circle cx="128" cy="86" r="10" fill="#E30613" opacity="0.65"/>
        <circle cx="18" cy="20" r="8" fill="#FFD54F" opacity="0.6"/>
      </g>
    </g>
  </g>

  <!-- lectern -->
  <g>
    <path d="M500 470 L520 400 L640 400 L660 470 Z" fill="#16161F"/>
    <rect x="512" y="392" width="136" height="14" rx="7" fill="#1E1E2A"/>
    <rect x="512" y="392" width="136" height="4" rx="2" fill="#16A34A" opacity="0.5"/>
    <circle cx="580" cy="366" r="16" fill="#04040A"/>
    <path d="M560 392 C560 372 570 362 580 362 C590 362 600 372 600 392 Z" fill="#04040A"/>
  </g>

  <!-- stage -->
  <rect x="0" y="470" width="1200" height="16" fill="#16161F"/>
  <rect x="0" y="486" width="1200" height="189" fill="#050508"/>
  <g opacity="0.2" fill="#16A34A"><circle cx="240" cy="490" r="90"/><circle cx="960" cy="490" r="90"/></g>

  <!-- seated audience -->
  <g fill="#06060C">
    <circle cx="90" cy="530" r="28"/><circle cx="240" cy="530" r="28"/><circle cx="390" cy="530" r="28"/>
    <circle cx="810" cy="530" r="28"/><circle cx="960" cy="530" r="28"/><circle cx="1110" cy="530" r="28"/>
    <circle cx="160" cy="614" r="40"/><circle cx="340" cy="614" r="40"/><circle cx="860" cy="614" r="40"/><circle cx="1040" cy="614" r="40"/>
  </g>
  <g fill="#06060C">
    <rect x="62" y="552" width="56" height="80" rx="26"/><rect x="212" y="552" width="56" height="80" rx="26"/>
    <rect x="362" y="552" width="56" height="80" rx="26"/><rect x="782" y="552" width="56" height="80" rx="26"/>
    <rect x="932" y="552" width="56" height="80" rx="26"/><rect x="1082" y="552" width="56" height="80" rx="26"/>
    <rect x="120" y="648" width="80" height="60" rx="30"/><rect x="300" y="648" width="80" height="60" rx="30"/>
    <rect x="820" y="648" width="80" height="60" rx="30"/><rect x="1000" y="648" width="80" height="60" rx="30"/>
  </g>
  <!-- laptops -->
  <g fill="#1E1E2A">
    <rect x="196" y="592" width="44" height="10" rx="3"/><rect x="376" y="592" width="44" height="10" rx="3"/>
    <rect x="796" y="592" width="44" height="10" rx="3"/><rect x="976" y="592" width="44" height="10" rx="3"/>
  </g>
  <g fill="#16A34A" opacity="0.5">
    <rect x="204" y="594" width="28" height="3" rx="1.5"/><rect x="384" y="594" width="28" height="3" rx="1.5"/>
    <rect x="804" y="594" width="28" height="3" rx="1.5"/><rect x="984" y="594" width="28" height="3" rx="1.5"/>
  </g>

  <rect width="1200" height="675" fill="#050508" opacity="0.06"/>
</svg>
