<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Virtual fan meet streaming worldwide">
  <defs>
    <linearGradient id="vtBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060B1A"/>
      <stop offset="0.55" stop-color="#0B1226"/>
      <stop offset="1" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="vtGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vtCore" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0.05"/>
    </radialGradient>
    <linearGradient id="vtEarth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#vtBg)"/>
  <ellipse cx="600" cy="300" rx="620" ry="360" fill="url(#vtGlow)"/>

  <!-- grid floor -->
  <g stroke="#60A5FA" stroke-opacity="0.10" stroke-width="1.5" fill="none">
    <path d="M0 470 L1200 470"/><path d="M0 505 L1200 505"/><path d="M0 545 L1200 545"/><path d="M0 592 L1200 592"/><path d="M0 646 L1200 646"/>
    <path d="M600 470 L-260 675"/><path d="M600 470 L60 675"/><path d="M600 470 L340 675"/>
    <path d="M600 470 L860 675"/><path d="M600 470 L1140 675"/><path d="M600 470 L1460 675"/>
  </g>

  <!-- globe -->
  <g transform="translate(600 300)">
    <circle r="220" fill="url(#vtCore)"/>
    <circle r="176" fill="url(#vtEarth)"/>
    <circle r="176" fill="none" stroke="#93C5FD" stroke-opacity="0.5" stroke-width="2.5"/>
    <!-- latitude lines -->
    <g fill="none" stroke="#BFDBFE" stroke-opacity="0.35" stroke-width="1.6">
      <ellipse rx="176" ry="60" cy="0"/>
      <ellipse rx="176" ry="120" cy="0"/>
      <ellipse rx="176" ry="60" cy="-92"/>
      <ellipse rx="176" ry="60" cy="92"/>
      <line x1="-176" y1="0" x2="176" y2="0"/>
    </g>
    <!-- longitude lines -->
    <g fill="none" stroke="#BFDBFE" stroke-opacity="0.30" stroke-width="1.6">
      <ellipse rx="60" ry="176"/>
      <ellipse rx="120" ry="176"/>
      <line x1="0" y1="-176" x2="0" y2="176"/>
    </g>
    <!-- connection arcs -->
    <g fill="none" stroke="#FFD54F" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M-108 40 Q -20 -70 60 -20" stroke-dasharray="8 10"/>
      <path d="M40 -110 Q 110 -20 96 66" stroke-dasharray="8 10"/>
      <path d="M-96 -70 Q 0 20 108 46" stroke-dasharray="8 10"/>
    </g>
    <!-- connection nodes -->
    <g>
      <circle cx="-108" cy="40" r="9" fill="#FFD54F"/>
      <circle cx="60" cy="-20" r="7" fill="#FFD54F"/>
      <circle cx="96" cy="66" r="9" fill="#E30613"/>
      <circle cx="-96" cy="-70" r="7" fill="#16A34A"/>
      <circle cx="108" cy="46" r="8" fill="#FFD54F"/>
    </g>
    <!-- play badge -->
    <circle r="62" fill="#050508" opacity="0.55"/>
    <circle r="62" fill="none" stroke="#FAFAFA" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M-18 -30 L38 0 L-18 30 Z" fill="#FAFAFA" opacity="0.92"/>
  </g>

  <!-- live badge -->
  <g transform="translate(150 90)">
    <rect x="0" y="0" width="150" height="52" rx="26" fill="#E30613" opacity="0.92"/>
    <circle cx="34" cy="26" r="9" fill="#FAFAFA"/>
    <circle cx="34" cy="26" r="4" fill="#E30613"/>
    <text x="56" y="34" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#FAFAFA">LIVE</text>
  </g>

  <!-- viewer count chip -->
  <g transform="translate(880 470)">
    <rect x="0" y="0" width="230" height="64" rx="18" fill="#0D0D14" opacity="0.85"/>
    <rect x="0" y="0" width="230" height="64" rx="18" fill="none" stroke="#1E1E2A" stroke-width="2"/>
    <g fill="#93C5FD" opacity="0.85">
      <circle cx="38" cy="26" r="11"/><circle cx="60" cy="32" r="9"/><circle cx="16" cy="34" r="8"/>
    </g>
    <rect x="86" y="20" width="90" height="11" rx="5.5" fill="#DBEAFE" opacity="0.6"/>
    <rect x="86" y="38" width="58" height="9" rx="4.5" fill="#DBEAFE" opacity="0.3"/>
  </g>

  <!-- chat bubbles -->
  <g>
    <rect x="120" y="500" width="180" height="66" rx="18" fill="#0D0D14" opacity="0.85"/>
    <rect x="120" y="500" width="180" height="66" rx="18" fill="none" stroke="#1E1E2A" stroke-width="2"/>
    <circle cx="156" cy="533" r="14" fill="#16A34A" opacity="0.8"/>
    <rect x="182" y="518" width="96" height="10" rx="5" fill="#DBEAFE" opacity="0.55"/>
    <rect x="182" y="538" width="62" height="9" rx="4.5" fill="#DBEAFE" opacity="0.28"/>
  </g>

  <!-- floating particles -->
  <g fill="#93C5FD">
    <circle cx="220" cy="240" r="5" opacity="0.6"/><circle cx="960" cy="220" r="4" opacity="0.5"/>
    <circle cx="320" cy="120" r="3" opacity="0.45"/><circle cx="880" cy="140" r="5" opacity="0.55"/>
    <circle cx="420" cy="560" r="4" opacity="0.4"/><circle cx="820" cy="600" r="3" opacity="0.5"/>
  </g>

  <rect width="1200" height="675" fill="#050508" opacity="0.05"/>
</svg>
