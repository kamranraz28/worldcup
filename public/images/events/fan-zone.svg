<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Fan zone with flags and confetti">
  <defs>
    <linearGradient id="fzSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A0A1E"/>
      <stop offset="0.55" stop-color="#2A0C1C"/>
      <stop offset="1" stop-color="#08060C"/>
    </linearGradient>
    <radialGradient id="fzGlow" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#E30613" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#E30613" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fzLamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD54F" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFD54F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#fzSky)"/>
  <ellipse cx="600" cy="470" rx="620" ry="300" fill="url(#fzGlow)"/>

  <!-- string lights -->
  <g stroke="#2A2A40" stroke-width="2" fill="none">
    <path d="M-20 90 Q 200 170 420 100 T 820 130 T 1220 90"/>
    <path d="M-20 170 Q 240 250 460 180 T 900 210 T 1220 170"/>
  </g>
  <g>
    <circle cx="60" cy="112" r="9" fill="#FFD54F" opacity="0.95"/><circle cx="140" cy="140" r="9" fill="#FFD54F" opacity="0.8"/>
    <circle cx="220" cy="146" r="9" fill="#FFECB3" opacity="0.9"/><circle cx="300" cy="126" r="9" fill="#FFD54F" opacity="0.75"/>
    <circle cx="380" cy="106" r="9" fill="#FFE9A8" opacity="0.9"/><circle cx="460" cy="100" r="9" fill="#FFD54F" opacity="0.7"/>
    <circle cx="620" cy="118" r="9" fill="#FFD54F" opacity="0.9"/><circle cx="700" cy="126" r="9" fill="#FFECB3" opacity="0.75"/>
    <circle cx="790" cy="126" r="9" fill="#FFD54F" opacity="0.85"/><circle cx="880" cy="118" r="9" fill="#FFE9A8" opacity="0.7"/>
    <circle cx="1000" cy="106" r="9" fill="#FFD54F" opacity="0.9"/><circle cx="1100" cy="98" r="9" fill="#FFECB3" opacity="0.8"/>
    <circle cx="120" cy="196" r="8" fill="#FFD54F" opacity="0.7"/><circle cx="240" cy="216" r="8" fill="#FFECB3" opacity="0.8"/>
    <circle cx="360" cy="204" r="8" fill="#FFD54F" opacity="0.65"/><circle cx="500" cy="188" r="8" fill="#FFD54F" opacity="0.8"/>
    <circle cx="640" cy="196" r="8" fill="#FFECB3" opacity="0.7"/><circle cx="780" cy="202" r="8" fill="#FFD54F" opacity="0.75"/>
    <circle cx="920" cy="200" r="8" fill="#FFD54F" opacity="0.7"/><circle cx="1060" cy="192" r="8" fill="#FFECB3" opacity="0.75"/>
  </g>

  <!-- flags -->
  <g>
    <path d="M150 20 L150 300" stroke="#1A1A26" stroke-width="6"/>
    <path d="M150 30 L268 58 L150 92 Z" fill="#E30613"/>
    <path d="M150 100 L258 126 L150 158 Z" fill="#FFD54F"/>
    <circle cx="150" cy="18" r="9" fill="#FFD54F"/>

    <path d="M600 0 L600 260" stroke="#1A1A26" stroke-width="6"/>
    <path d="M600 10 L740 44 L600 84 Z" fill="#16A34A"/>
    <path d="M600 94 L730 126 L600 164 Z" fill="#FAFAFA" opacity="0.9"/>
    <circle cx="600" cy="-2" r="9" fill="#E30613"/>

    <path d="M1040 24 L1040 300" stroke="#1A1A26" stroke-width="6"/>
    <path d="M1040 34 L1150 62 L1040 96 Z" fill="#3B82F6"/>
    <path d="M1040 104 L1142 130 L1040 162 Z" fill="#E30613"/>
    <circle cx="1040" cy="22" r="9" fill="#FFD54F"/>
