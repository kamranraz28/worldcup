  <!-- confetti -->
  <g opacity="0.85">
    <rect x="80" y="300" width="10" height="20" rx="2" fill="#FFD54F" transform="rotate(25 85 310)"/>
    <rect x="210" y="250" width="10" height="20" rx="2" fill="#16A34A" transform="rotate(-18 215 260)"/>
    <rect x="330" y="320" width="10" height="20" rx="2" fill="#E30613" transform="rotate(40 335 330)"/>
    <rect x="470" y="270" width="10" height="20" rx="2" fill="#3B82F6" transform="rotate(-30 475 280)"/>
    <rect x="700" y="300" width="10" height="20" rx="2" fill="#FFD54F" transform="rotate(15 705 310)"/>
    <rect x="830" y="260" width="10" height="20" rx="2" fill="#E30613" transform="rotate(-22 835 270)"/>
    <rect x="960" y="320" width="10" height="20" rx="2" fill="#16A34A" transform="rotate(35 965 330)"/>
    <rect x="1130" y="270" width="10" height="20" rx="2" fill="#FFD54F" transform="rotate(-12 1135 280)"/>
    <circle cx="150" cy="360" r="6" fill="#FAFAFA" opacity="0.7"/>
    <circle cx="560" cy="350" r="6" fill="#FAFAFA" opacity="0.6"/>
    <circle cx="1010" cy="370" r="6" fill="#FAFAFA" opacity="0.65"/>
  </g>

  <!-- stall canopies -->
  <g>
    <path d="M250 430 L420 430 L440 400 L270 400 Z" fill="#E30613" opacity="0.85"/>
    <rect x="266" y="430" width="148" height="120" fill="#0B0B14" opacity="0.9"/>
    <rect x="280" y="452" width="120" height="60" rx="8" fill="#FFD54F" opacity="0.2"/>
    <circle cx="340" cy="500" r="46" fill="#FFD54F" opacity="0.06"/>

    <path d="M760 430 L930 430 L950 400 L780 400 Z" fill="#16A34A" opacity="0.85"/>
    <rect x="776" y="430" width="148" height="120" fill="#0B0B14" opacity="0.9"/>
    <rect x="790" y="452" width="120" height="60" rx="8" fill="#FAFAFA" opacity="0.12"/>
    <circle cx="850" cy="500" r="46" fill="#FAFAFA" opacity="0.05"/>
  </g>

  <!-- floor -->
  <rect x="0" y="546" width="1200" height="129" fill="#0B0B14"/>
  <g opacity="0.25" fill="#E30613"><circle cx="340" cy="560" r="90"/><circle cx="850" cy="560" r="90"/></g>

  <!-- crowd silhouettes with arms up -->
  <g fill="#06060C">
    <circle cx="120" cy="600" r="34"/><rect x="86" y="628" width="68" height="70" rx="30"/>
    <circle cx="530" cy="590" r="36"/><rect x="494" y="620" width="72" height="78" rx="32"/>
    <circle cx="1120" cy="600" r="34"/><rect x="1086" y="628" width="68" height="70" rx="30"/>
  </g>
  <g stroke="#06060C" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M104 566 L74 512"/><path d="M136 566 L166 512"/>
    <path d="M512 552 L476 494"/><path d="M548 552 L584 494"/>
    <path d="M1104 566 L1074 512"/><path d="M1136 566 L1166 512"/>
  </g>

  <ellipse cx="600" cy="120" rx="520" ry="160" fill="url(#fzLamp)" opacity="0.25"/>
  <rect width="1200" height="675" fill="#050508" opacity="0.08"/>
</svg>
